# Publie le site sur GitHub Pages, sur la branche « gh-pages » :
#   https://tlzz-okey.github.io/FHD-website/       page d'accueil (choix de la version)
#   https://tlzz-okey.github.io/FHD-website/v1/    branche master
#   https://tlzz-okey.github.io/FHD-website/v2/    branche theme-canadiens
#   https://tlzz-okey.github.io/FHD-website/v3/    branche theme-noir
# Relancé à chaque envoi sur l'une des trois branches, ou à la main
# (onglet Actions › « Publier sur GitHub Pages » › Run workflow).
name: Publier sur GitHub Pages

on:
  push:
    branches: [master, theme-canadiens, theme-noir]
  workflow_dispatch:

permissions:
  contents: write   # pour mettre à jour la branche gh-pages

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  publier:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Assembler les trois versions (v1, v2, v3)
        run: ./deploy/construire-pages.sh _site

      - name: Publier sur la branche gh-pages
        working-directory: _site
        run: |
          git init --quiet --initial-branch=gh-pages
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit --quiet -m "Publication depuis ${GITHUB_REF_NAME} (${GITHUB_SHA::7})"
          git push --force --quiet "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
