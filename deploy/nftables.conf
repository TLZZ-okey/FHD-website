#!/usr/sbin/nft -f
#
# Pare-feu nftables du serveur des sites fhdeserable-v1/v2/v3.fr
# À copier dans /etc/nftables.conf (voir DEPLOIEMENT.md).
#
# Docker est configuré pour ne créer AUCUNE règle (deploy/daemon.json : "iptables": false).
# Le port 80 publié par le reverse proxy est alors servi par « docker-proxy », un petit
# programme de Docker qui écoute directement sur le serveur : il suffit d'autoriser
# l'entrée sur le port 80 (chaîne input), sans redirection NAT.
#
# ⚠ « flush ruleset » efface toutes les règles existantes (y compris celles laissées
#   par Docker ou par un autre pare-feu) avant de charger celles-ci.

flush ruleset

# ---- À adapter ----------------------------------------------------------------
define RESEAU_LOCAL  = 192.168.1.0/24          # réseau de la maison
define PORT_SSH      = 22                      # port SSH du serveur (pour ne pas perdre l'accès)
define IF_DOCKER     = { "docker0", "br-fhd" } # interfaces des réseaux Docker
define RESEAUX_DOCKER = { 172.17.0.0/16, 172.30.0.0/24 }
# -------------------------------------------------------------------------------

table inet filtre {

    # Trafic à destination du serveur lui-même
    chain input {
        type filter hook input priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop
        iif "lo" accept

        # Ping et ICMPv6 (indispensable au bon fonctionnement d'IPv6)
        ip protocol icmp accept
        meta l4proto ipv6-icmp accept

        # Administration à distance
        tcp dport $PORT_SSH accept

        # Sites web : reverse proxy sur le port 80, depuis le réseau de la maison
        ip saddr $RESEAU_LOCAL tcp dport 80 accept

        # Les conteneurs peuvent joindre le serveur (DNS, docker-proxy…)
        iifname $IF_DOCKER accept
    }

    # Trafic qui traverse le serveur (conteneurs <-> extérieur, conteneur <-> conteneur)
    chain forward {
        type filter hook forward priority filter; policy drop;

        ct state established,related accept
        ct state invalid drop

        # Reverse proxy <-> conteneurs des versions, sur le réseau interne
        iifname $IF_DOCKER oifname $IF_DOCKER accept

        # Les conteneurs peuvent sortir (mises à jour, résolution DNS externe…)
        iifname $IF_DOCKER accept
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}

# Sortie des conteneurs vers Internet : masquage d'adresse (ce que Docker faisait
# avec iptables). Sans cela, les conteneurs n'ont pas accès à l'extérieur.
table ip nat {
    chain postrouting {
        type nat hook postrouting priority srcnat; policy accept;
        ip saddr $RESEAUX_DOCKER oifname != $IF_DOCKER masquerade
    }
}
