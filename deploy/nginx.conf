# Serveur web d'UNE version du site (à l'intérieur de son conteneur).
# Il ne connaît pas les noms de domaine : c'est le reverse proxy (deploy/proxy.conf)
# qui choisit la version selon le domaine demandé et gère les redirections www.
server {
    listen 80 default_server;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Sécurité de base
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Pages HTML et données (js/data.js) : toujours la dernière version
    location ~* \.(html|js|css)$ {
        expires -1;
    }

    # Images et polices : mises en cache 30 jours
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
