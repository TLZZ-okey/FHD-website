# Récupère le port tapé dans l'adresse (ex. « :8002 ») pour le conserver
# lors de la redirection www -> fhdeserable.fr, quel que soit le port utilisé.
map $http_host $suffixe_port {
    "~:(?<p>[0-9]+)$" ":$p";
    default           "";
}

# Redirige www.fhdeserable.fr vers fhdeserable.fr
server {
    listen 80;
    server_name www.fhdeserable.fr;
    return 301 http://fhdeserable.fr$suffixe_port$request_uri;
}

server {
    listen 80 default_server;
    # default_server : le site répond aussi si on l'appelle par l'adresse IP du serveur
    server_name fhdeserable.fr _;

    root  /usr/share/nginx/html;
    index index.html;
    charset utf-8;

    # Sécurité de base
    server_tokens off;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Compression
    gzip on;
    gzip_types text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Pages HTML et données (js/data.js) : toujours la dernière version
    location ~* \.(html|js|css)$ {
        expires -1;
    }

    # Images et polices : mises en cache 30 jours
    location ~* \.(jpg|jpeg|png|webp|svg|ico|woff2)$ {
        expires 30d;
        access_log off;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
