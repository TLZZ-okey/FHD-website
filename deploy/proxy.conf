# Reverse proxy : seul conteneur joignable depuis le réseau (port 80 du serveur).
# Il lit le nom de domaine demandé et transmet la visite au conteneur de la version.
# Les conteneurs des versions n'ont aucun port ouvert sur le serveur : on ne les
# joint qu'en passant par ici, via le réseau Docker interne « fhd ».

server_tokens off;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# --- fhdeserable-v1.fr : version d'origine (branche master) -------------------
server {
    listen 80;
    server_name fhdeserable-v1.fr;
    location / { proxy_pass http://site-v1:80; }
}
server {
    listen 80;
    server_name www.fhdeserable-v1.fr;
    return 301 http://fhdeserable-v1.fr$request_uri;
}

# --- fhdeserable-v2.fr : thème Canadiens (branche theme-canadiens) ------------
server {
    listen 80;
    server_name fhdeserable-v2.fr;
    location / { proxy_pass http://site-v2:80; }
}
server {
    listen 80;
    server_name www.fhdeserable-v2.fr;
    return 301 http://fhdeserable-v2.fr$request_uri;
}

# --- fhdeserable-v3.fr : thème Noir (branche theme-noir) ----------------------
server {
    listen 80;
    server_name fhdeserable-v3.fr;
    location / { proxy_pass http://site-v3:80; }
}
server {
    listen 80;
    server_name www.fhdeserable-v3.fr;
    return 301 http://fhdeserable-v3.fr$request_uri;
}

# --- Tout autre nom, ou l'adresse IP seule : aucun site ------------------------
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
