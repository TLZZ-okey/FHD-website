# Aiguilleur (reverse proxy) sur le port 80 du serveur :
# chaque nom de domaine est envoyé vers le conteneur de sa version.
# Un nom de domaine ne désigne qu'une adresse IP : c'est ce proxy qui fait le lien
# domaine -> port, pour que l'adresse fonctionne sans « :8001 », « :8002 »…

proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
server_tokens off;

# fhdeserable-v1.fr -> version d'origine (port 8001)
server {
    listen 80;
    server_name fhdeserable-v1.fr www.fhdeserable-v1.fr;
    location / { proxy_pass http://site-original:80; }
}

# fhdeserable-v2.fr -> thème Canadiens (port 8002)
server {
    listen 80;
    server_name fhdeserable-v2.fr www.fhdeserable-v2.fr;
    location / { proxy_pass http://site-canadiens:80; }
}

# fhdeserable-v3.fr -> thème Noir (port 8003)
server {
    listen 80;
    server_name fhdeserable-v3.fr www.fhdeserable-v3.fr;
    location / { proxy_pass http://site-noir:80; }
}

# Tout autre nom (ou l'adresse IP seule) : pas de site
server {
    listen 80 default_server;
    server_name _;
    return 404;
}
