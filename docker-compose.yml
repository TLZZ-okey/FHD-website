# Trois versions du site, une par conteneur, chacune sur son port :
#
#   http://<adresse-du-serveur>:8001  ->  fhdeserable-v1  version d'origine (branche master)
#   http://<adresse-du-serveur>:8002  ->  fhdeserable-v2  thème Canadiens   (branche theme-canadiens)
#   http://<adresse-du-serveur>:8003  ->  fhdeserable-v3  thème Noir        (branche theme-noir)
#
# Prérequis : ./deploy/versions.sh (prépare versions/*), deploy/daemon.json et
# deploy/nftables.conf installés sur le serveur (voir DEPLOIEMENT.md).

services:
  site-v1:
    build: ./versions/master
    image: fhdeserable-v1
    container_name: fhdeserable-v1
    restart: unless-stopped
    ports: ["8001:80"]
    networks: [fhd]

  site-v2:
    build: ./versions/theme-canadiens
    image: fhdeserable-v2
    container_name: fhdeserable-v2
    restart: unless-stopped
    ports: ["8002:80"]
    networks: [fhd]

  site-v3:
    build: ./versions/theme-noir
    image: fhdeserable-v3
    container_name: fhdeserable-v3
    restart: unless-stopped
    ports: ["8003:80"]
    networks: [fhd]

# Réseau aux noms fixes, pour que deploy/nftables.conf puisse le désigner :
# interface « br-fhd », adresses 172.30.0.0/24.
networks:
  fhd:
    name: fhd
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-fhd
    ipam:
      config:
        - subnet: 172.30.0.0/24
