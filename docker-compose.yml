# Trois versions du site, chacune avec son nom de domaine et son port :
#
#   http://fhdeserable-v1.fr  (ou http://<serveur>:8001)  ->  version d'origine  (branche master)
#   http://fhdeserable-v2.fr  (ou http://<serveur>:8002)  ->  thème Canadiens    (branche theme-canadiens)
#   http://fhdeserable-v3.fr  (ou http://<serveur>:8003)  ->  thème Noir         (branche theme-noir)
#
# Le service « proxy » écoute sur le port 80 et envoie chaque domaine vers le bon conteneur,
# pour que les adresses fonctionnent sans avoir à taper le port.
# Les dossiers versions/* sont préparés (et mis à jour) par : ./deploy/versions.sh
services:
  site-original:
    build: ./versions/master
    image: fhdeserable-v1
    container_name: fhdeserable-v1
    restart: unless-stopped
    environment:
      DOMAINE: fhdeserable-v1.fr
    ports:
      - "8001:80"

  site-canadiens:
    build: ./versions/theme-canadiens
    image: fhdeserable-v2
    container_name: fhdeserable-v2
    restart: unless-stopped
    environment:
      DOMAINE: fhdeserable-v2.fr
    ports:
      - "8002:80"

  site-noir:
    build: ./versions/theme-noir
    image: fhdeserable-v3
    container_name: fhdeserable-v3
    restart: unless-stopped
    environment:
      DOMAINE: fhdeserable-v3.fr
    ports:
      - "8003:80"

  proxy:
    image: nginx:1.27-alpine
    container_name: fhdeserable-proxy
    restart: unless-stopped
    volumes:
      - ./deploy/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - site-original
      - site-canadiens
      - site-noir
