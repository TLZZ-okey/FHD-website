# Une version du site par conteneur, chacune sur son nom de domaine,
# derrière un reverse proxy (seul conteneur exposé, sur le port 80 du serveur) :
#
#   http://fhdeserable-v1.fr  ->  conteneur fhdeserable-v1  (branche master)
#   http://fhdeserable-v2.fr  ->  conteneur fhdeserable-v2  (branche theme-canadiens)
#   http://fhdeserable-v3.fr  ->  conteneur fhdeserable-v3  (branche theme-noir)
#
# Prérequis : ./deploy/versions.sh (prépare versions/*), deploy/daemon.json et
# deploy/nftables.conf installés sur le serveur (voir DEPLOIEMENT.md).

services:
  site-v1:
    build: ./versions/master
    image: fhdeserable-v1
    container_name: fhdeserable-v1
    restart: unless-stopped
    networks: [fhd]

  site-v2:
    build: ./versions/theme-canadiens
    image: fhdeserable-v2
    container_name: fhdeserable-v2
    restart: unless-stopped
    networks: [fhd]

  site-v3:
    build: ./versions/theme-noir
    image: fhdeserable-v3
    container_name: fhdeserable-v3
    restart: unless-stopped
    networks: [fhd]

  proxy:
    image: nginx:1.27-alpine
    container_name: fhdeserable-proxy
    restart: unless-stopped
    volumes:
      - ./deploy/proxy.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    networks: [fhd]
    depends_on: [site-v1, site-v2, site-v3]

# Réseau interne aux noms fixes, pour que deploy/nftables.conf puisse le désigner :
# interface « br-fhd », adresses 172.30.0.0/24.
networks:
  fhd:
    name: fhd
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-fhd
    ipam:
      config:
        - subnet: 172.30.0.0/24
